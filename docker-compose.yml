version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dodik_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dodik_user
      POSTGRES_PASSWORD: dodik_password
      POSTGRES_DB: dodik_tracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
