version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dodik_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dodik_user
      POSTGRES_PASSWORD: dodik_password
      POSTGRES_DB: dodik_tracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dodik_network

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: dodik_prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - prowlarr_data:/config
    networks:
      - dodik_network

  torrserver:
    image: yourok/torrserver:latest
    container_name: dodik_torrserver
    restart: unless-stopped
    environment:
      - TS_PORT=8090
    volumes:
      - torrserver_data:/torrents
    networks:
      - dodik_network

networks:
  dodik_network:
    driver: bridge

volumes:
  pgdata:
  prowlarr_data:
  torrserver_data:
